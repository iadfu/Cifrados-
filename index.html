<style>
  :root{
    --bg:#F3E9D8;
    --bg-elevated:#FFFEFB;
    --ink:#1C3934;
    --ink-soft:#4E605A;
    --accent:#D95D3B;
    --accent-ink:#8A3820;
    --accent-soft:rgba(217,93,59,0.14);
    --chord:#0F6B5C;
    --success:#3F7A5C;
    --danger:#B23A3A;
    --danger-soft:rgba(178,58,58,0.12);
    --border:rgba(28,57,52,0.12);
    --shadow:rgba(28,57,52,0.18);
    --card-shadow:0 1px 2px rgba(28,57,52,0.06), 0 6px 16px rgba(28,57,52,0.08);
    --card-shadow-hover:0 2px 4px rgba(28,57,52,0.07), 0 10px 24px rgba(28,57,52,0.12);
    --radius:18px;
    --font-display: ui-rounded, 'SF Pro Rounded', var(--font-body);
    --font-body: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12201C; --bg-elevated:#1A2E28; --ink:#F2E9DC; --ink-soft:#A9BDB4;
      --accent:#F0805A; --accent-ink:#FFD4C2; --accent-soft:rgba(240,128,90,0.18);
      --chord:#4FC9AC; --success:#7FBFA0; --danger:#E38585; --danger-soft:rgba(227,133,133,0.14);
      --border:rgba(242,233,220,0.14); --shadow:rgba(0,0,0,0.45);
      --card-shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
      --card-shadow-hover:0 2px 4px rgba(0,0,0,0.32), 0 10px 26px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12201C; --bg-elevated:#1A2E28; --ink:#F2E9DC; --ink-soft:#A9BDB4;
    --accent:#F0805A; --accent-ink:#FFD4C2; --accent-soft:rgba(240,128,90,0.18);
    --chord:#4FC9AC; --success:#7FBFA0; --danger:#E38585; --danger-soft:rgba(227,133,133,0.14);
    --border:rgba(242,233,220,0.14); --shadow:rgba(0,0,0,0.45);
    --card-shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    --card-shadow-hover:0 2px 4px rgba(0,0,0,0.32), 0 10px 26px rgba(0,0,0,0.4);
  }
  :root[data-theme="light"]{
    --bg:#F3E9D8; --bg-elevated:#FFFEFB; --ink:#1C3934; --ink-soft:#4E605A;
    --accent:#D95D3B; --accent-ink:#8A3820; --accent-soft:rgba(217,93,59,0.14);
    --chord:#0F6B5C; --success:#3F7A5C; --danger:#B23A3A; --danger-soft:rgba(178,58,58,0.12);
    --border:rgba(28,57,52,0.12); --shadow:rgba(28,57,52,0.18);
    --card-shadow:0 1px 2px rgba(28,57,52,0.06), 0 6px 16px rgba(28,57,52,0.08);
    --card-shadow-hover:0 2px 4px rgba(28,57,52,0.07), 0 10px 24px rgba(28,57,52,0.12);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  body{ margin:0; }
  #cifrados-app{
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    max-width:560px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (min-width:700px){
    #cifrados-app{ max-width:760px; }
  }
  @media (min-width:1000px){
    #cifrados-app{ max-width:960px; }
  }
  button{ font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  #cifrados-app{ -webkit-tap-highlight-color:transparent; }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding:18px 20px 14px;
    display:flex; flex-direction:column; gap:14px;
  }
  .topbar-row{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    width:40px; height:40px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid transparent; border-radius:12px; color:var(--ink);
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .icon-btn:hover{ background:var(--accent-soft); }
  .icon-btn:active{ transform:scale(0.92); }
  .app-title{
    font-family:var(--font-display); font-size:22px; font-weight:600;
    letter-spacing:0.2px; margin:0; flex:1;
  }
  .role-badge{
    flex:none; font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:999px;
    border:1px solid var(--border); background:var(--bg-elevated); color:var(--ink-soft);
    font-family:var(--font-body);
  }
  .role-badge.is-lider{ color:var(--accent-ink); background:var(--accent-soft); border-color:transparent; }
  .tab-bar{ display:flex; gap:8px; padding-top:2px; }
  .tab-btn{
    flex:1; padding:11px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--ink-soft); font-size:14px; font-weight:700;
    font-family:var(--font-body); transition:background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }
  .tab-btn:active{ transform:scale(0.97); }
  .tab-btn.active{ background:var(--accent); border-color:var(--accent); color:#2A1006; box-shadow:0 3px 10px rgba(217,93,59,0.28); }
  .search-wrap{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px;
    padding:10px 14px; transition:box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .search-wrap:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .search-wrap input{
    border:none; outline:none; background:transparent; color:var(--ink);
    font-size:15px; width:100%; font-family:var(--font-body);
  }
  .search-wrap input::placeholder{ color:var(--ink-soft); }
  main{ flex:1; padding:16px 18px 100px; }
  .empty-state{
    margin-top:60px; text-align:center; color:var(--ink-soft);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .empty-state svg{ opacity:0.5; }
  .song-list{ display:flex; flex-direction:column; gap:12px; list-style:none; padding:0; margin:0; }
  @media (min-width:700px){
    .song-list:not(.is-cifrados){ display:grid; grid-template-columns:repeat(2, 1fr); align-items:start; gap:14px; }
  }
  @media (min-width:1000px){
    .song-list:not(.is-cifrados){ grid-template-columns:repeat(3, 1fr); }
  }
  .song-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; display:flex; align-items:center; gap:12px;
    box-shadow:var(--card-shadow); text-align:left; width:100%; color:var(--ink);
    transition:box-shadow 0.18s ease, transform 0.12s ease, border-color 0.18s ease;
  }
  .song-card:hover{ border-color:var(--accent); box-shadow:var(--card-shadow-hover); transform:translateY(-1px); }
  .song-card:active{ transform:translateY(0) scale(0.99); }
  .song-card-info{ flex:1; min-width:0; }
  .song-card-title{
    font-family:var(--font-display); font-size:17px; font-weight:700; margin:0 0 2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .song-card-artist{ font-size:13.5px; color:var(--ink-soft); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tono-badge{
    flex:none; font-family:var(--font-mono); font-weight:700; font-size:14px;
    color:var(--accent-ink); background:var(--accent-soft); border-radius:10px;
    padding:6px 10px; min-width:34px; text-align:center;
  }
  .fab{
    position:fixed; bottom:26px; left:50%; transform:translateX(calc(-1 * min(280px, 50vw) + 0px));
    z-index:6;
  }
  .fab-inner{
    max-width:560px; margin:0 auto; padding:0 18px; display:flex; justify-content:flex-end;
    pointer-events:none;
  }
  .fab button{
    pointer-events:auto;
    width:58px; height:58px; border-radius:50%; border:none;
    background:var(--accent); color:#2A1006; box-shadow:0 8px 20px rgba(217,93,59,0.35), 0 2px 6px rgba(28,57,52,0.15);
    display:flex; align-items:center; justify-content:center;
    transition:box-shadow 0.18s ease, transform 0.15s ease;
  }
  .fab button:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(217,93,59,0.4), 0 3px 8px rgba(28,57,52,0.18); }
  .fab button:active{ transform:translateY(0) scale(0.94); }

  .detail-header{
    display:flex; flex-direction:column; gap:10px; padding:16px 18px 10px; position:sticky; top:0;
    background:var(--bg); z-index:5; border-bottom:1px solid var(--border);
  }
  .detail-header-top{ display:flex; align-items:flex-start; gap:10px; }
  .detail-titles{ flex:1; min-width:0; }
  .detail-titles h1{ font-family:var(--font-display); font-size:21px; font-weight:700; margin:2px 0 0; text-wrap:balance; }
  .detail-titles p{ margin:2px 0 0; color:var(--ink-soft); font-size:14px; }
  .detail-actions{ display:flex; gap:8px; overflow-x:auto; }
  .action-pill{
    display:inline-flex; align-items:center; gap:6px; flex:none;
    padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--ink); font-size:13px; font-weight:700;
    font-family:var(--font-body); white-space:nowrap;
    transition:border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .action-pill:hover{ border-color:var(--accent); }
  .action-pill:active{ transform:scale(0.96); }
  .action-pill.is-danger{ color:var(--danger); }
  .action-pill.is-live-active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }

  .ref-link-wrap{ padding:12px 18px 0; }
  .ref-link{
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--accent-soft); color:var(--accent-ink); font-size:13.5px; font-weight:700;
    text-decoration:none; font-family:var(--font-body);
  }
  .ref-link:hover{ border-color:var(--accent); }

  .sec-roadmap{ display:flex; gap:8px; overflow-x:auto; padding:14px 18px 0; }
  .sec-pill{
    display:inline-flex; align-items:center; gap:6px; flex:none;
    padding:7px 13px; border-radius:999px; border:1px solid var(--border);
    background:var(--bg-elevated); font-size:12.5px; font-weight:700;
    color:var(--ink-soft); white-space:nowrap; font-family:var(--font-body);
    transition:border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .sec-pill:hover{ border-color:var(--accent); color:var(--ink); }
  .sec-pill:active{ transform:scale(0.96); }
  .sec-pill .dot{ width:8px; height:8px; border-radius:50%; background:var(--dot); flex:none; }

  .chord-scroll{ padding:14px 18px 18px; display:flex; flex-direction:column; }
  .chord-col{ display:flex; flex-direction:column; min-width:0; }
  @media (min-width:700px){
    .chord-scroll{ flex-direction:row; gap:0 18px; align-items:flex-start; }
    .chord-col{ flex:1; }
  }
  .print-columns-acordes{ display:none; }
  .sec-box{
    border:1px solid var(--border); border-left:3px solid var(--dot, var(--accent)); border-radius:var(--radius);
    margin-bottom:16px; background:var(--bg-elevated); overflow:hidden; box-shadow:var(--card-shadow);
  }
  .sec-box:last-child{ margin-bottom:0; }
  .sec-box-header{ display:flex; align-items:center; gap:8px; padding:11px 16px; border-bottom:1px solid var(--border); }
  .sec-box-header .dot{ width:9px; height:9px; border-radius:50%; background:var(--dot); flex:none; }
  .sec-box-header span{ font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink); }
  .sec-note{
    margin:0; padding:8px 16px; font-size:12.5px; font-style:italic; color:var(--accent-ink);
    background:var(--accent-soft); border-bottom:1px solid var(--border);
  }
  .chord-sheet{
    font-family:var(--font-mono); white-space:pre; line-height:1.75;
    font-size:var(--sheet-size, 16px); tab-size:4;
    overflow-x:auto; padding:14px 16px; margin:0; display:block;
  }
  .chord-sheet .line{ display:block; }
  .chord-sheet.chords-flow .line{ white-space:pre-wrap; margin-bottom:8px; }
  .chord-sheet.chords-flow .line:last-child{ margin-bottom:0; }
  .chord{ color:var(--chord); font-weight:800; letter-spacing:0.02em; }

  .pdf-backdrop{ position:fixed; inset:0; z-index:35; background:transparent; }
  .pdf-backdrop[hidden]{ display:none; }
  .pdf-dropdown{
    position:fixed; background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--card-shadow-hover); padding:8px; display:flex; flex-direction:column; gap:2px;
    min-width:230px; z-index:36;
  }
  .pdf-dropdown[hidden]{ display:none; }
  .pdf-dropdown-item{
    text-align:left; padding:11px 12px; border-radius:10px; border:none; background:transparent;
    color:var(--ink); font-size:14px; font-weight:600; font-family:var(--font-body);
    transition:background 0.12s ease;
  }
  .pdf-dropdown-item:hover{ background:var(--accent-soft); color:var(--accent-ink); }
  .pdf-dropdown-item.is-primary{ color:var(--accent-ink); font-weight:700; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5);
    display:flex; align-items:flex-end; justify-content:center; z-index:30;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal-card{
    background:var(--bg-elevated); width:100%; max-width:560px;
    border-radius:24px 24px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px;
    box-shadow:0 -8px 30px rgba(31,42,68,0.18);
  }
  .modal-card h2{ font-family:var(--font-display); font-size:18px; margin:0; }
  .modal-card p{ margin:0 0 6px; color:var(--ink-soft); font-size:14px; }

  .transpose-bar{
    position:sticky; bottom:0; z-index:5;
    background:var(--bg-elevated); border-top:1px solid var(--border);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:18px;
  }
  .step-btn{
    width:46px; height:46px; border-radius:50%; border:1px solid var(--border);
    background:var(--bg); color:var(--ink); font-size:20px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    transition:border-color 0.15s ease, color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  .step-btn:hover{ border-color:var(--accent); color:var(--accent-ink); box-shadow:0 3px 10px var(--shadow); }
  .step-btn:active{ transform:scale(0.92); }
  .tono-display{ font-family:var(--font-mono); font-size:15px; color:var(--ink-soft); min-width:110px; text-align:center; }
  .tono-display b{ font-size:20px; color:var(--ink); display:block; }
  .fontsize-toggle{ display:flex; gap:2px; margin-left:6px; }
  .fontsize-toggle button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--bg);
    color:var(--ink-soft); font-family:var(--font-mono); font-size:13px;
  }
  .fontsize-toggle button:hover{ color:var(--ink); border-color:var(--accent); }

  .form-view{ padding:16px 18px 40px; display:flex; flex-direction:column; gap:16px; }
  @media (min-width:700px){
    .form-view, .share-view, .inicio-view{ max-width:640px; margin:0 auto; width:100%; }
  }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; min-width:0; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:13px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .field input, .field textarea{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
    padding:11px 14px; font-size:15.5px; color:var(--ink); font-family:var(--font-body);
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none; }
  .field textarea{ font-family:var(--font-mono); min-height:260px; line-height:1.6; resize:vertical; }
  .field small{ color:var(--ink-soft); font-size:12.5px; }
  .form-actions{ display:flex; gap:10px; margin-top:4px; }
  .btn{
    flex:1; padding:13px 16px; border-radius:14px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--ink); font-size:15px; font-weight:600;
    transition:box-shadow 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#2A1006; box-shadow:0 3px 10px rgba(217,93,59,0.28); }
  .btn-primary:hover{ border-color:var(--accent); box-shadow:0 5px 14px rgba(217,93,59,0.34); }
  .btn-danger{ background:var(--danger-soft); border-color:transparent; color:var(--danger); flex:none; }
  .btn-danger-solid{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn-danger-solid:hover{ border-color:var(--danger); box-shadow:0 3px 10px var(--danger-soft); }

  .sec-edit-row{
    border:1px solid var(--border); border-radius:14px; padding:12px;
    margin-bottom:12px; background:var(--bg-elevated); box-shadow:var(--card-shadow);
  }
  .sec-edit-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .sec-edit-top select{
    flex:1; min-width:0; background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-size:14px; color:var(--ink); font-family:var(--font-body);
  }
  .sec-edit-veces{ display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13px; color:var(--ink-soft); }
  .sec-edit-veces label{ font-weight:600; }
  .sec-edit-veces input{
    width:52px; background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:6px 8px; font-size:14px; color:var(--ink); font-family:var(--font-body); text-align:center;
  }
  .sec-edit-move{ display:flex; gap:2px; flex:none; }
  .sec-edit-move .icon-btn{ width:34px; height:34px; }
  .sec-edit-move .icon-btn:disabled{ opacity:0.3; }
  .sec-edit-move .icon-btn:disabled:hover{ background:transparent; }
  .sec-contenido-wrap{ position:relative; display:block; max-width:100%; }
  .sec-contenido{
    width:100%; font-family:var(--font-mono); background:var(--bg); border:1px solid var(--border);
    border-radius:8px; padding:10px 22px 22px 10px; font-size:14px; min-height:90px; line-height:1.5;
    color:var(--ink); resize:none; display:block; box-sizing:border-box;
  }
  .sec-contenido-grip{
    position:absolute; right:3px; bottom:3px; width:20px; height:20px;
    cursor:nwse-resize; touch-action:none;
    background-image:repeating-linear-gradient(135deg, var(--ink-soft) 0 1.5px, transparent 1.5px 4.5px);
    -webkit-mask-image:linear-gradient(135deg, transparent 45%, #000 45%);
    mask-image:linear-gradient(135deg, transparent 45%, #000 45%);
    opacity:0.6;
  }
  .sec-contenido-grip:hover{ opacity:1; }
  .sec-contenido-grip:focus-visible{ opacity:1; outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }

  .share-view{ padding:16px 18px 40px; display:flex; flex-direction:column; gap:22px; }
  .share-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--card-shadow);
  }
  .share-card h2{ font-family:var(--font-display); font-size:17px; margin:0; }
  .share-card p{ margin:0; color:var(--ink-soft); font-size:14px; line-height:1.5; }
  .file-drop{
    border:1.5px dashed var(--border); border-radius:12px; padding:16px; text-align:center;
    color:var(--ink-soft); font-size:14px; position:relative;
  }
  .file-drop input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  .inicio-view{ padding:22px 18px 40px; display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; }
  .inicio-logo{ width:132px; height:132px; object-fit:contain; }
  .inicio-title{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; color:var(--ink); }

  .wsp-hero{ width:100%; max-width:360px; margin:0 auto; border-radius:20px; overflow:hidden; box-shadow:var(--card-shadow-hover); }

  const SHARP_SCALE = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const FLAT_TO_SHARP = {Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#',Cb:'B',Fb:'E'};
  const ALLOWED_SUFFIX = /^[majindusg0-9#+\-]*$/i;

  const SECTION_TYPES = ['Intro','Verso 1','Verso 2','Verso 3','Pre Coro','Coro','Coro 1','Coro 2','Puente','Interludio','Final'];
  const SECTION_ABBR = { 'Intro':'I', 'Verso 1':'V1', 'Verso 2':'V2', 'Verso 3':'V3', 'Pre Coro':'Pr', 'Coro':'C', 'Coro 1':'C1', 'Coro 2':'C2', 'Puente':'P', 'Interludio':'It', 'Final':'F' };
  const SECTION_COLORS = {
    'Intro':'63,120,110', 'Verso 1':'90,101,163', 'Verso 2':'90,101,163', 'Verso 3':'90,101,163',

  };
  function sectionAbbr(tipo){ return SECTION_ABBR[tipo] || (tipo ? tipo.slice(0,2).toUpperCase() : '·'); }
  function sectionColor(tipo){ return SECTION_COLORS[tipo] || '107,114,128'; }

  function uid(){
    return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
  }

  function migrateSong(song){
    if(!song.secciones || !song.secciones.length){
      song.secciones = [{ id: uid(), tipo: 'Intro', contenido: song.cuerpo || '' }];
    }
    delete song.cuerpo;
    return song;
  }

  function loadSongs(){
    try{ const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); return Array.isArray(raw) ? raw.map(migrateSong) : []; }
    catch(e){ return []; }
  }
  function saveSongsLocal(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(songs)); }
  function saveSongs(){ saveSongsLocal(); pushToCloud(); }

  function demoSong(){

      id: uid(),
      titulo: 'Ejemplo — cómo escribir un cifrado',
      artista: 'Guía rápida (puedes borrar esta canción)',
      tono: 'G',

      secciones: [

      ],

    };

  const CULTOS_KEY = 'cifrados_cultos_v1';
  function loadCultos(){
    try{ const raw = JSON.parse(localStorage.getItem(CULTOS_KEY)); return Array.isArray(raw) ? raw : []; }
    catch(e){ return []; }
  }
  function saveCultosLocal(){ localStorage.setItem(CULTOS_KEY, JSON.stringify(cultos)); }
  function saveCultos(){ saveCultosLocal(); pushToCloud(); }

  let songs = loadSongs();
  let cultos = loadCultos();
  if(songs.length === 0 && !db){ songs = [demoSong()]; saveSongsLocal(); }

  function pushToCloud(){
    if(!db || suppressPush) return;
    const cloudSongs = songs.map(s => ({
      id: s.id, titulo: s.titulo, artista: s.artista, tono: s.tono,
      tempo: s.tempo || '', compas: s.compas || '', link: s.link || '', secciones: s.secciones, updatedAt: s.updatedAt
    }));
    db.collection('iglesia').doc('datos').set({ songs: cloudSongs, cultos, syncedAt: Date.now() })
      .catch(e => console.warn('No se pudo sincronizar con la nube', e));
  }
  function mergeCloudData(data){
    suppressPush = true;
    if(Array.isArray(data.songs)){
      const localById = new Map(songs.map(s => [s.id, s]));
      songs = data.songs.map(cs => {
        const local = localById.get(cs.id);
        return migrateSong({
          ...cs,
          transpose: local ? (local.transpose || 0) : 0,
          fontScale: local ? (local.fontScale || 1) : 1
        });
      });
      saveSongsLocal();
    }
    if(Array.isArray(data.cultos)){
      cultos = data.cultos;
      saveCultosLocal();
    }
    suppressPush = false;
    render();
  }
  function initCloudSync(){
    if(!db) return;
    const ref = db.collection('iglesia').doc('datos');
    let first = true;
    ref.onSnapshot(snap => {
      if(snap.exists){
        mergeCloudData(snap.data());

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function noteIndex(note){
    let n = note;
    if(FLAT_TO_SHARP[n]) n = FLAT_TO_SHARP[n];
    return SHARP_SCALE.indexOf(n);
  }
  function transposeNote(note, semitones){
    const idx = noteIndex(note);
    if(idx < 0) return note;
    const newIdx = ((idx + semitones) % 12 + 12) % 12;
    return SHARP_SCALE[newIdx];
  }
  function parseChord(tok){
    const m = tok.match(/^([A-G])(#|b)?([A-Za-z0-9#+\-\/]*)$/);
    if(!m) return null;
    return { root: m[1], acc: m[2] || '', rest: m[3] || '' };
  }
  function isChordToken(tok){
    const p = parseChord(tok);
    if(!p) return false;
    let suffix = p.rest;
    const slash = suffix.match(/^(.*)\/([A-G])(#|b)?$/);
    if(slash) suffix = slash[1];
    if(suffix.length > 7) return false;
    return ALLOWED_SUFFIX.test(suffix);
  }
  function transposeChordToken(tok, semitones){
    if(!semitones) return tok;
    const p = parseChord(tok);
    if(!p) return tok;
    const newRoot = transposeNote(p.root + p.acc, semitones);
    const slash = p.rest.match(/^(.*)\/([A-G])(#|b)?$/);
    if(slash){
      const mainSuffix = slash[1];
      const newBass = transposeNote(slash[2] + (slash[3]||''), semitones);
      return newRoot + mainSuffix + '/' + newBass;
    }
    return newRoot + p.rest;
  }

  function renderCuerpo(cuerpo, semitones){
    return cuerpo.split('\n').map(line=>{
      if(line.trim() === '') return '<span class="line lyric-line"></span>';
      const tokens = line.match(/\S+/g) || [];
      const allChords = tokens.length > 0 && tokens.every(isChordToken);
      if(!allChords) return '<span class="line lyric-line">' + escapeHtml(line) + '</span>';
      let out = ''; let lastIndex = 0;
      const re = /\S+/g; let mm;
      while((mm = re.exec(line))){
        out += escapeHtml(line.slice(lastIndex, mm.index));
        out += '<span class="chord">' + escapeHtml(transposeChordToken(mm[0], semitones)) + '</span>';
        lastIndex = mm.index + mm[0].length;
      }
      out += escapeHtml(line.slice(lastIndex));
      return '<span class="line chord-line">' + out + '</span>';
    }).join('');
  }

  function renderChordsOnly(cuerpo, semitones){
    const rows = [];
    cuerpo.split('\n').forEach(line => {
      if(line.trim() === '') return;
      const tokens = line.match(/\S+/g) || [];
      const allChords = tokens.length > 0 && tokens.every(isChordToken);
      if(!allChords) return;
      rows.push(tokens.map(t => transposeChordToken(t, semitones)));
    });
    return rows.map(tokens =>
      '<span class="line chord-line">' + tokens.map(t => '<span class="chord">' + escapeHtml(t) + '</span>').join(' ') + '</span>'
    ).join('');
  }

  function extractLyricsOnly(cuerpo){
    return (cuerpo || '').split('\n').filter(line => {
      if(line.trim() === '') return true;
      const tokens = line.match(/\S+/g) || [];
      const allChords = tokens.length > 0 && tokens.every(isChordToken);
      return !allChords;
    }).join('\n');
  }

  function formatLyricsForAudience(text){
    return (text || '')
      .split(/\n\s*\n/)
      .map(block => block.split('\n').map(l => l.trim()).filter(Boolean).join(' ').trim())
      .filter(p => p.length > 0);
  }
  function preventOrphanSpace(text){
    const idx = text.lastIndexOf(' ');
    if(idx === -1) return text;
    return text.slice(0, idx) + ' ' + text.slice(idx + 1);
  }

  function maxLineChars(text){
    let max = 0;
    (text || '').split('\n').forEach(line => { if(line.length > max) max = line.length; });
    return max;
  }

  function computePrintFontSize(song, mode, semis){
    const BASE = 11.5, MIN = 7, SAFE_CHARS = 46;
    let maxChars = 0;
    (song.secciones || []).forEach(sec => {
      const contenido = sec.contenido || '';
      maxChars = Math.max(maxChars, maxLineChars(contenido));
      if(mode === 'acordes' || mode === 'completo'){
        const flowHtml = renderChordsOnly(contenido, semis);
        const tmp = document.createElement('div');
        tmp.innerHTML = flowHtml;
        tmp.querySelectorAll('.line').forEach(line => {
          maxChars = Math.max(maxChars, (line.textContent || '').length);
        });
      }
    });
    if(maxChars <= SAFE_CHARS) return BASE;
    return Math.max(MIN, +(BASE * (SAFE_CHARS / maxChars)).toFixed(2));
  }

  const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  function formatFecha(fecha){
    if(!fecha) return '';
    const [y,m,d] = fecha.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return DIAS[dt.getDay()] + ' ' + d + ' de ' + MESES[m-1] + ' de ' + y;
  }
  function formatHora(hora){
    if(!hora) return '';
    let [h,min] = hora.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return h + ':' + String(min).padStart(2,'0') + ' ' + ampm;
  }

  function normalizeUrl(url){
    if(!url) return '';
    return /^[a-z]+:\/\//i.test(url) ? url : 'https://' + url;

  function detectPlatform(url){
    try{
      const host = new URL(normalizeUrl(url)).hostname.replace('www.','');
      if(host.includes('youtube') || host.includes('youtu.be')) return 'YouTube';
      if(host.includes('spotify')) return 'Spotify';
      if(host.includes('music.apple')) return 'Apple Music';
      return 'link externo';
    } catch(e){ return 'link externo'; }
  }

  function renderDetail(){

    const semis = state.viewOnly ? (state.forcedTranspose || 0) : (song.transpose || 0);
    const scale = song.fontScale || 1;
    const displayTono = transposeChordToken(song.tono || '-', semis);
    const secciones = song.secciones && song.secciones.length ? song.secciones : [{ id:'x', tipo:'', contenido:'' }];

    app.innerHTML = `
      <div class="detail-header">
        <div class="detail-header-top">
          <button class="icon-btn" id="btn-back" aria-label="Volver">${ICONS.back}</button>
          <div class="detail-titles">
            <h1>${escapeHtml(song.titulo)}</h1>
            <p>${escapeHtml(song.artista || 'Sin artista')}${song.tempo ? ' · ' + escapeHtml(song.tempo) + ' BPM' : ''}${song.compas ? ' · ' + escapeHtml(song.compas) : ''}</p>

        </div>

      ` : ''}
      <div class="print-header">
        <div>
          <h1>${escapeHtml(song.titulo)}</h1>
          <p>${escapeHtml(song.artista || 'Sin artista')}</p>
        </div>
        <div class="print-meta">
          <div>Tono: <b>${escapeHtml(displayTono)}</b></div>
          ${song.tempo ? `<div>Tempo: <b>${escapeHtml(song.tempo)}</b></div>` : ''}
          ${song.compas ? `<div>Compás: <b>${escapeHtml(song.compas)}</b></div>` : ''}
        </div>
      </div>
      <div class="sec-roadmap">
        ${secciones.map(sec => `
          <button type="button" class="sec-pill" data-scrollto="sec-${sec.id}" style="--dot:rgb(${sectionColor(sec.tipo)})">
            <span class="dot"></span>${escapeHtml(sectionAbbr(sec.tipo) + (sec.veces && sec.veces > 1 ? '×' + sec.veces : ''))}
          </button>
        `).join('')}
      </div>
      <div class="chord-scroll">
        <div class="chord-col">${secciones.slice(0, Math.ceil(secciones.length/2)).map(sec => sectionBoxHtml(sec, semis, scale, true)).join('')}</div>
        <div class="chord-col">${secciones.slice(Math.ceil(secciones.length/2)).map(sec => sectionBoxHtml(sec, semis, scale, true)).join('')}</div>
      </div>
      <div class="print-columns-acordes">
        <div class="print-col">${secciones.slice(0, Math.ceil(secciones.length/2)).map(sec => sectionBoxHtmlChordsOnly(sec, semis, scale)).join('')}</div>
        <div class="print-col">${secciones.slice(Math.ceil(secciones.length/2)).map(sec => sectionBoxHtmlChordsOnly(sec, semis, scale)).join('')}</div>
      </div>
      <div class="transpose-bar">
        ${state.viewOnly ? '' : `<button class="step-btn" id="btn-down" aria-label="Bajar semitono">−</button>`}
        <div class="tono-display">${state.viewOnly ? 'Tono para este culto' : 'Tono'}<b>${escapeHtml(displayTono)}</b></div>
        ${state.viewOnly ? '' : `<button class="step-btn" id="btn-up" aria-label="Subir semitono">+</button>`}
        <div class="fontsize-toggle">
          <button id="btn-font-down" aria-label="Letra más chica">A−</button>
          <button id="btn-font-up" aria-label="Letra más grande">A+</button>
        </div>
      </div>
      <div class="pdf-backdrop" id="pdf-backdrop" hidden></div>
      <div class="pdf-dropdown" id="pdf-modal" hidden>
        <button class="pdf-dropdown-item is-primary" id="btn-pdf-completo">Clasificación + acordes + letra</button>
        <button class="pdf-dropdown-item" id="btn-pdf-letra">Clasificación + letra</button>
        <button class="pdf-dropdown-item" id="btn-pdf-acordes">Clasificación + acordes</button>
      </div>
    `;
    app.classList.toggle('live-mode', state.liveView);
    app.querySelector('#btn-back').addEventListener('click', () => {
      if(state.viewOnly && state.returnView) go(state.returnView, state.returnId);
      else go('list');
    });
    app.querySelector('#btn-live').addEventListener('click', () => { state.liveView = !state.liveView; renderDetail(); });
    const pdfBtn = app.querySelector('#btn-pdf');
    const pdfMenu = app.querySelector('#pdf-modal');
    const pdfBackdrop = app.querySelector('#pdf-backdrop');
    function openPdfMenu(){
      const r = pdfBtn.getBoundingClientRect();
      const menuWidth = 240;
      pdfMenu.style.top = (r.bottom + 6) + 'px';
      pdfMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - menuWidth - 8)) + 'px';
      pdfMenu.hidden = false;
      pdfBackdrop.hidden = false;
    }
    function closePdfMenu(){ pdfMenu.hidden = true; pdfBackdrop.hidden = true; }
    pdfBtn.addEventListener('click', openPdfMenu);
    pdfBackdrop.addEventListener('click', closePdfMenu);
    function printWithMode(mode){
      closePdfMenu();
      app.dataset.printMode = mode;
      const fontSize = computePrintFontSize(song, mode, semis);
      document.documentElement.style.setProperty('--print-font-size', fontSize + 'px');
      document.title = song.titulo.replace(/[\\/:*?"<>|]/g, '-');
      window.print();
    }
    app.querySelector('#btn-pdf-letra').addEventListener('click', () => printWithMode('letra'));
    app.querySelector('#btn-pdf-acordes').addEventListener('click', () => printWithMode('acordes'));
    app.querySelector('#btn-pdf-completo').addEventListener('click', () => printWithMode('completo'));
    if(isLider() && !state.viewOnly){
      app.querySelector('#btn-edit').addEventListener('click', () => go('form', song.id));
      app.querySelector('#btn-delete').addEventListener('click', () => {
        customConfirm('¿Eliminar "' + song.titulo + '"? Esta acción no se puede deshacer.', () => {
          songs = songs.filter(s => s.id !== song.id);
          saveSongs();
          go('list');
        });
      });
    }
    if(!state.viewOnly){
      app.querySelector('#btn-down').addEventListener('click', () => { song.transpose = (song.transpose||0) - 1; renderDetail(); });
      app.querySelector('#btn-up').addEventListener('click', () => { song.transpose = (song.transpose||0) + 1; renderDetail(); });
    }
    app.querySelector('#btn-font-down').addEventListener('click', () => { song.fontScale = Math.max(0.75, (song.fontScale||1) - 0.125); saveSongs(); renderDetail(); });
    app.querySelector('#btn-font-up').addEventListener('click', () => { song.fontScale = Math.min(2, (song.fontScale||1) + 0.125); saveSongs(); renderDetail(); });
    app.querySelectorAll('.sec-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const el = document.getElementById(btn.dataset.scrollto);
        if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
  }

  function renderForm(){
    const editing = state.currentId ? songs.find(s => s.id === state.currentId) : null;
    let formSecciones = (editing && editing.secciones && editing.secciones.length)
      ? editing.secciones.map(s => ({ id: uid(), tipo: s.tipo, contenido: s.contenido, veces: s.veces || 1 }))
      : [{ id: uid(), tipo: 'Intro', contenido: '', veces: 1 }];

    function seccionRowHtml(sec, idx){
      return `
        <div class="sec-edit-row">
          <div class="sec-edit-top">
            <select class="sec-tipo-select" data-idx="${idx}">
              ${SECTION_TYPES.map(t => `<option value="${t}" ${t===sec.tipo?'selected':''}>${t}</option>`).join('')}
            </select>
            <div class="sec-edit-move">
              <button type="button" class="icon-btn sec-move-up" data-idx="${idx}" aria-label="Subir sección" ${idx===0?'disabled':''}>↑</button>
              <button type="button" class="icon-btn sec-move-down" data-idx="${idx}" aria-label="Bajar sección" ${idx===formSecciones.length-1?'disabled':''}>↓</button>
              <button type="button" class="icon-btn sec-remove" data-idx="${idx}" aria-label="Eliminar sección">${ICONS.trash}</button>
            </div>
          </div>
          <div class="sec-edit-veces">
            <label for="sec-veces-${idx}">Se repite</label>
            <input type="number" min="1" max="20" id="sec-veces-${idx}" class="sec-veces-input" data-idx="${idx}" value="${sec.veces || 1}" />
            <span>${(sec.veces||1) > 1 ? 'veces' : 'vez'}</span>
          </div>
          <input type="text" class="sec-nota-input" data-idx="${idx}" value="${escapeHtml(sec.nota || '')}" placeholder="Nota de matiz (opcional): entra guitarra, solo batería..." style="margin-bottom:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; color:var(--ink); font-family:var(--font-body); width:100%;" />
          <div class="sec-contenido-wrap">
            <textarea class="sec-contenido" data-idx="${idx}" placeholder="Acordes en su propia línea, letra debajo">${escapeHtml(sec.contenido)}</textarea>
            <div class="sec-contenido-grip" data-idx="${idx}" tabindex="0" role="slider" aria-label="Redimensionar área de texto" aria-valuetext="Usa las flechas del teclado para cambiar el tamaño"></div>
          </div>
        </div>
      `;
    }

    function renderSeccionesList(){
      const list = app.querySelector('#secciones-list');
      list.innerHTML = formSecciones.map(seccionRowHtml).join('');
      list.querySelectorAll('.sec-tipo-select').forEach(sel => sel.addEventListener('change', e => {
        formSecciones[+e.target.dataset.idx].tipo = e.target.value;
      }));
      list.querySelectorAll('.sec-veces-input').forEach(inp => inp.addEventListener('input', e => {
        const val = Math.max(1, Math.min(20, parseInt(e.target.value, 10) || 1));
        formSecciones[+e.target.dataset.idx].veces = val;
      }));
      list.querySelectorAll('.sec-contenido').forEach(ta => ta.addEventListener('input', e => {
        formSecciones[+e.target.dataset.idx].contenido = e.target.value;
      }));
      list.querySelectorAll('.sec-contenido-grip').forEach(grip => {
        const wrap = grip.closest('.sec-contenido-wrap');
        const ta = wrap.querySelector('.sec-contenido');
        let startX, startY, startW, startH;
        function onMove(e){
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          ta.style.width = Math.max(180, startW + dx) + 'px';
          ta.style.height = Math.max(90, startH + dy) + 'px';
        }
        function onUp(e){
          grip.releasePointerCapture(e.pointerId);
          grip.removeEventListener('pointermove', onMove);
          grip.removeEventListener('pointerup', onUp);
        }
        grip.addEventListener('pointerdown', e => {
          e.preventDefault();
          startX = e.clientX; startY = e.clientY;
          const rect = ta.getBoundingClientRect();
          startW = rect.width; startH = rect.height;
          grip.setPointerCapture(e.pointerId);
          grip.addEventListener('pointermove', onMove);
          grip.addEventListener('pointerup', onUp);
        });
        grip.addEventListener('keydown', e => {
          const step = 20;
          const rect = ta.getBoundingClientRect();
          if(e.key === 'ArrowRight'){ ta.style.width = Math.max(180, rect.width + step) + 'px'; e.preventDefault(); }
          else if(e.key === 'ArrowLeft'){ ta.style.width = Math.max(180, rect.width - step) + 'px'; e.preventDefault(); }
          else if(e.key === 'ArrowDown'){ ta.style.height = Math.max(90, rect.height + step) + 'px'; e.preventDefault(); }
          else if(e.key === 'ArrowUp'){ ta.style.height = Math.max(90, rect.height - step) + 'px'; e.preventDefault(); }
        });
      });
      list.querySelectorAll('.sec-nota-input').forEach(inp => inp.addEventListener('input', e => {
        formSecciones[+e.target.dataset.idx].nota = e.target.value;
      }));
      list.querySelectorAll('.sec-move-up').forEach(btn => btn.addEventListener('click', () => {
        const i = +btn.dataset.idx;
        if(i > 0){ [formSecciones[i-1], formSecciones[i]] = [formSecciones[i], formSecciones[i-1]]; renderSeccionesList(); }
      }));
      list.querySelectorAll('.sec-move-down').forEach(btn => btn.addEventListener('click', () => {
        const i = +btn.dataset.idx;
        if(i < formSecciones.length - 1){ [formSecciones[i+1], formSecciones[i]] = [formSecciones[i], formSecciones[i+1]]; renderSeccionesList(); }
      }));
      list.querySelectorAll('.sec-remove').forEach(btn => btn.addEventListener('click', () => {
        if(formSecciones.length <= 1){ showToast('Debe quedar al menos una sección'); return; }
        formSecciones.splice(+btn.dataset.idx, 1);
        renderSeccionesList();
      }));
    }

    app.innerHTML = `
      <div class="detail-header">
        <button class="icon-btn" id="btn-back" aria-label="Volver">${ICONS.back}</button>
        <div class="detail-titles"><h1>${editing ? 'Editar cifrado' : 'Nuevo cifrado'}</h1></div>
      </div>
      <div class="form-view">
        <div class="field">
          <label for="f-titulo">Título</label>
          <input id="f-titulo" type="text" value="${escapeHtml(editing ? editing.titulo : '')}" placeholder="Nombre de la canción" />
        </div>
        <div class="field">
          <label for="f-artista">Artista / autor</label>
          <input id="f-artista" type="text" value="${escapeHtml(editing ? (editing.artista||'') : '')}" placeholder="Opcional" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-tono">Tono original</label>
            <input id="f-tono" type="text" value="${escapeHtml(editing ? editing.tono : '')}" placeholder="Ej: G, Am, D7" />
          </div>
          <div class="field">
            <label for="f-tempo">Tempo (BPM)</label>
            <input id="f-tempo" type="text" value="${escapeHtml(editing ? (editing.tempo||'') : '')}" placeholder="Ej: 68" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-compas">Compás</label>
            <input id="f-compas" type="text" value="${escapeHtml(editing ? (editing.compas||'') : '')}" placeholder="Ej: 4/4" />
          </div>
        </div>
        <small style="margin-top:-10px; color:var(--ink-soft)">Tono: notación de acordes C D E F G A B, con m, 7, sus4, etc.</small>
        <div class="field">
          <label for="f-link">Link de referencia</label>
          <input id="f-link" type="url" value="${escapeHtml(editing ? (editing.link||'') : '')}" placeholder="YouTube, Spotify, Apple Music..." />
          <small>Opcional. Los músicos van a poder tocarlo para escuchar la versión original.</small>
        </div>
        <div class="field">
          <label>Secciones del cifrado</label>
          <div id="secciones-list"></div>
          <button type="button" class="btn" id="btn-add-seccion" style="width:100%">+ Agregar sección</button>
          <small>Clasifica cada bloque (Intro, Verso 1, Coro, etc.) y escribe los acordes en su propia línea, arriba de la letra.</small>
        </div>
        <div class="form-actions">
          ${editing ? '<button class="btn btn-danger" id="btn-delete" aria-label="Eliminar">' + ICONS.trash + '</button>' : ''}
          <button class="btn btn-primary" id="btn-save">Guardar</button>
        </div>
      </div>
    `;
    renderSeccionesList();
    app.querySelector('#btn-back').addEventListener('click', () => editing ? go('detail', editing.id) : go('list'));
    app.querySelector('#btn-add-seccion').addEventListener('click', () => {
      formSecciones.push({ id: uid(), tipo: 'Coro', contenido: '', nota: '' });
      renderSeccionesList();
    });
    if(editing){
      app.querySelector('#btn-delete').addEventListener('click', () => {
        customConfirm('¿Eliminar "' + editing.titulo + '"? Esta acción no se puede deshacer.', () => {
          songs = songs.filter(s => s.id !== editing.id);
          saveSongs();
          go('list');
        });
      });

      const filename = 'cifrados-respaldo-' + new Date().toISOString().slice(0,10) + '.json';
      try{
        if(window.claude && window.claude.downloads){
          const res = await window.claude.downloads.save({ filename, data });
          if(res && res.accepted === false){ showToast('Descarga cancelada'); return; }
          showToast('Archivo descargado');
        } else {
          throw new Error('no downloads api');
        }
      } catch(e){
        const blob = new Blob([data], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; document.body.appendChild(a); a.click();

        try{
          const parsed = JSON.parse(reader.result);
          const incoming = Array.isArray(parsed) ? parsed : parsed.songs;
          if(!Array.isArray(incoming)) throw new Error('formato inválido');
          let added = 0;
          incoming.forEach(item => {
            if(!item || !item.titulo) return;
            const exists = songs.some(s => s.titulo === item.titulo && s.artista === item.artista);
            if(exists) return;
            const secciones = (item.secciones && item.secciones.length)

              tono: item.tono || '-',
              tempo: item.tempo || '',
              link: item.link || '',
              secciones,
              transpose: 0,
              fontScale: 1,
              updatedAt: Date.now()
            });

          });

          renderShare();
        } catch(err){
          showToast('No se pudo leer el archivo');
        }
      };
      reader.readAsText(file);
    });
  }

  function proyChannelName(cultoId){ return 'cifraviva-proy-' + cultoId; }
  function proyStorageKey(cultoId){ return 'cifraviva-proy-state-' + cultoId; }
  const PROY_FONDOS = [
    { id:'negro', nombre:'Negro' },
    { id:'degradado', nombre:'Degradado' },
    { id:'destellos', nombre:'Destellos' },
    { id:'aurora', nombre:'Aurora' },
    { id:'oceano', nombre:'Océano' },
    { id:'vinotinto', nombre:'Vino tinto' },
    { id:'carbon', nombre:'Carbón' },
    { id:'estrellado', nombre:'Estrellado' },
    { id:'vineta', nombre:'Viñeta' }
  ];
  const PROY_DEFAULT_STATE = { songIndex:0, sectionIndex:0, blackout:false, fondoAudiencia:'negro', fondoMusicos:'negro' };
  function proyLoadState(cultoId){
    try{
      const raw = localStorage.getItem(proyStorageKey(cultoId));
      if(raw) return { ...PROY_DEFAULT_STATE, ...JSON.parse(raw) };
    }catch(e){}
    return { ...PROY_DEFAULT_STATE };
  }
  function proySaveState(cultoId, st){
    try{ localStorage.setItem(proyStorageKey(cultoId), JSON.stringify(st)); }catch(e){}
  }
  function letraOverrideKey(cultoId, songId, secId){ return 'cifraviva-letra-' + cultoId + '-' + songId + '-' + secId; }
  function getLetraOverride(culto, song, sec){
    if(!culto || !song || !sec) return null;
    try{
      const raw = localStorage.getItem(letraOverrideKey(culto.id, song.id, sec.id));
      if(raw !== null) return raw;
    }catch(e){}
    const stored = culto.letrasEditadas && culto.letrasEditadas[song.id + '::' + sec.id];
    return (stored !== undefined) ? stored : null;
  }
  function setLetraOverride(culto, song, sec, texto){
    culto.letrasEditadas = culto.letrasEditadas || {};
    culto.letrasEditadas[song.id + '::' + sec.id] = texto;
    saveCultos();
    try{ localStorage.setItem(letraOverrideKey(culto.id, song.id, sec.id), texto); }catch(e){}
  }
  function clearLetraOverride(culto, song, sec){
    if(culto.letrasEditadas) delete culto.letrasEditadas[song.id + '::' + sec.id];
    saveCultos();
    try{ localStorage.removeItem(letraOverrideKey(culto.id, song.id, sec.id)); }catch(e){}
  }
  function computeProyFontScale(cuerpo){
    const lines = (cuerpo || '').split('\n').filter(l => l.trim() !== '').length;
    const SAFE_LINES = 8;
    if(lines <= SAFE_LINES) return 1;
    return Math.max(0.42, SAFE_LINES / lines);
  }

  function computeKioskContent(culto, list, proy, mode){
    const fondo = mode === 'audiencia' ? proy.fondoAudiencia : proy.fondoMusicos;
    if(!culto || !list.length) return { empty:true, fondo };
    if(proy.blackout) return { blackout:true, fondo };
    const idx = Math.min(Math.max(proy.songIndex, 0), list.length - 1);
    const song = list[idx];
    const semis = (culto.transposes && culto.transposes[song.id]) || 0;
    const secs = (song.secciones && song.secciones.length) ? song.secciones : [];
    const secIdx = Math.min(Math.max(proy.sectionIndex, 0), Math.max(0, secs.length - 1));
    const sec = secs[secIdx];
    let bodyHtml, contenidoParaEscala;
    if(mode === 'audiencia'){
      const override = getLetraOverride(culto, song, sec);
      const rawText = override !== null ? override : extractLyricsOnly(sec ? sec.contenido : '');
      contenidoParaEscala = rawText;
      const paragraphs = formatLyricsForAudience(rawText);
      bodyHtml = paragraphs.length
        ? paragraphs.map(p => '<span class="line lyric-line">' + escapeHtml(preventOrphanSpace(p)) + '</span>').join('')
        : '';
    } else {
      contenidoParaEscala = sec ? sec.contenido : '';
      bodyHtml = sec ? renderCuerpo(sec.contenido || '', semis) : '';
    }
    return {
      empty:false, blackout:false, fondo, song, bodyHtml,
      fontScale: computeProyFontScale(contenidoParaEscala),
      tonoDisplay: transposeChordToken(song.tono || '-', semis),
      tempo: song.tempo || '', compas: song.compas || ''
    };
  }

  function renderProyeccionControl(){

    const list = culto.songIds.map(id => songs.find(s => s.id === id)).filter(Boolean);
    if(!list.length){ go('culto-detail', culto.id); return; }
    let proy = proyLoadState(culto.id);
    if(proy.songIndex >= list.length || proy.songIndex < 0) proy.songIndex = 0;
    if(proyKioskChannelKey !== 'control:' + culto.id){
      if(proyKioskChannel) proyKioskChannel.close();
      proyKioskChannelKey = 'control:' + culto.id;
      proyKioskChannel = new BroadcastChannel(proyChannelName(culto.id));
    }
    const channel = proyKioskChannel;

    function currentSong(){ return list[proy.songIndex]; }
    function currentSecciones(){
      const s = currentSong();
      return (s && s.secciones && s.secciones.length) ? s.secciones : [];
    }
    function clampSection(){
      const secs = currentSecciones();
      if(proy.sectionIndex >= secs.length) proy.sectionIndex = Math.max(0, secs.length - 1);
      if(proy.sectionIndex < 0) proy.sectionIndex = 0;
    }
    clampSection();

    function broadcast(){
      proySaveState(culto.id, proy);
      channel.postMessage(proy);
      paint();
    }
    function goToSong(idx){
      if(idx < 0 || idx >= list.length) return;
      proy = { ...proy, songIndex: idx, sectionIndex: 0 };
      broadcast();
    }
    function goToSection(idx){
      const secs = currentSecciones();
      if(idx < 0 || idx >= secs.length) return;
      proy = { ...proy, sectionIndex: idx };
      broadcast();
    }
    function nextSection(){
      const secs = currentSecciones();
      if(proy.sectionIndex < secs.length - 1) goToSection(proy.sectionIndex + 1);
      else if(proy.songIndex < list.length - 1) goToSong(proy.songIndex + 1);
    }
    function prevSection(){
      if(proy.sectionIndex > 0) goToSection(proy.sectionIndex - 1);
      else if(proy.songIndex > 0){
        const prevIdx = proy.songIndex - 1;
        const prevSecs = (list[prevIdx].secciones || []);
        proy = { ...proy, songIndex: prevIdx, sectionIndex: Math.max(0, prevSecs.length - 1) };
        broadcast();

    function adjustPreviewScale(mode, delta){
      const cur = loadProyManualScale(culto.id, mode);

          ${'getScreenDetails' in window ? `
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
              <button type="button" class="btn" id="btn-choose-screens" style="flex:none;">Elegir pantallas de salida</button>
              ${screensList ? ['audiencia','musicos'].map(m => `
                <label style="font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;">
                  ${m === 'audiencia' ? 'Audiencia' : 'Músicos'}:
                  <select data-screen-select="${m}" style="padding:4px 6px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--ink);">
                    ${screensList.map((s,i) => `<option value="${i}" ${selectedScreen[m]===i?'selected':''}>Pantalla ${i+1}${s.isPrimary?' (principal)':''} — ${s.width}×${s.height}</option>`).join('')}
                  </select>
                </label>
              `).join('') : '<span style="font-size:12.5px; color:var(--ink-soft);">Detecta tus pantallas conectadas para que cada ventana se abra directo en la correcta.</span>'}
            </div>
          ` : ''}
          <div>
            <p style="font-weight:700; margin:0 0 10px; font-size:16px;">Fondo — Audiencia</p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              ${PROY_FONDOS.map(f => `
                <button type="button" class="proy-fondo-swatch proy-bg-${f.id} ${proy.fondoAudiencia === f.id ? 'proy-active' : ''}" data-fondo-audiencia="${f.id}">
                  <span>${escapeHtml(f.nombre)}</span>
                </button>
              `).join('')}
            </div>
          </div>
          <div>
            <p style="font-weight:700; margin:0 0 10px; font-size:16px;">Fondo — Músicos</p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              ${PROY_FONDOS.map(f => `
                <button type="button" class="proy-fondo-swatch proy-bg-${f.id} ${proy.fondoMusicos === f.id ? 'proy-active' : ''}" data-fondo-musicos="${f.id}">
                  <span>${escapeHtml(f.nombre)}</span>
                </button>
              `).join('')}
            </div>
          </div>
          <div>
            <p style="font-weight:700; margin:0 0 10px; font-size:16px;">${song ? escapeHtml(song.titulo) : ''}</p>
            <div style="display:flex; flex-wrap:wrap; gap:8px;">
              ${secs.map((sec,i) => `
                <button type="button" class="sec-pill ${i===proy.sectionIndex ? 'proy-active' : ''}" data-sec="${i}" style="--dot:rgb(${sectionColor(sec.tipo)})">
                  <span class="dot"></span>${escapeHtml(sectionLabel(sec))}
                </button>
              `).join('')}
            </div>
          </div>
          <div style="display:flex; gap:10px;">
            <button type="button" class="btn" id="btn-prev">◀ Anterior</button>
            <button type="button" class="btn" id="btn-next">Siguiente ▶</button>
          </div>
          ${(() => {
            const curSec = secs[proy.sectionIndex];
            if(!curSec) return '';
            const override = getLetraOverride(culto, song, curSec);
            const letraTexto = override !== null ? override : extractLyricsOnly(curSec.contenido);
            return `
              <div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
                  <p style="font-weight:700; margin:0; font-size:16px;">Letra para audiencia — ${escapeHtml(sectionLabel(curSec))}</p>
                  ${override !== null ? '<span class="opt-tag">editada</span>' : ''}
                </div>
                <textarea id="letra-audiencia-edit" class="sec-contenido" style="min-height:110px;">${escapeHtml(letraTexto)}</textarea>
                <div style="display:flex; gap:8px; margin-top:10px;">
                  <button type="button" class="btn" id="btn-letra-guardar">Guardar</button>
                  ${override !== null ? '<button type="button" class="btn" id="btn-letra-restaurar">Restaurar original</button>' : ''}
                </div>
              </div>
            `;
          })()}
          <ul class="song-list">
            ${list.map((s,i) => `
              <li>
                <button type="button" class="song-card ${i===proy.songIndex ? 'proy-active' : ''}" data-song="${i}">
                  <span class="tono-badge" style="min-width:26px;">${i+1}</span>
                  <div class="song-card-info">
                    <p class="song-card-title">${escapeHtml(s.titulo)}</p>
                  </div>
                </button>
              </li>
            `).join('')}
          </ul>
        </main>
      `;
      app.querySelector('#btn-back').addEventListener('click', () => go('culto-detail', culto.id));
      app.querySelector('#btn-open-audiencia').addEventListener('click', () => openWindow('audiencia'));
      app.querySelector('#btn-open-musicos').addEventListener('click', () => openWindow('musicos'));
      app.querySelector('#btn-blackout').addEventListener('click', toggleBlackout);
      const btnChooseScreens = app.querySelector('#btn-choose-screens');
      if(btnChooseScreens) btnChooseScreens.addEventListener('click', chooseScreens);
      app.querySelectorAll('[data-screen-select]').forEach(sel => sel.addEventListener('change', e => {
        selectedScreen[sel.dataset.screenSelect] = +e.target.value;
      }));
      app.querySelectorAll('[data-fondo-audiencia]').forEach(btn => btn.addEventListener('click', () => setFondo('audiencia', btn.dataset.fondoAudiencia)));
      app.querySelectorAll('[data-fondo-musicos]').forEach(btn => btn.addEventListener('click', () => setFondo('musicos', btn.dataset.fondoMusicos)));
      app.querySelectorAll('[data-scale-down]').forEach(btn => btn.addEventListener('click', () => adjustPreviewScale(btn.dataset.scaleDown, -0.1)));
      app.querySelectorAll('[data-scale-up]').forEach(btn => btn.addEventListener('click', () => adjustPreviewScale(btn.dataset.scaleUp, 0.1)));
      app.querySelector('#btn-prev').addEventListener('click', prevSection);
      app.querySelector('#btn-next').addEventListener('click', nextSection);
      app.querySelectorAll('[data-sec]').forEach(btn => btn.addEventListener('click', () => goToSection(+btn.dataset.sec)));
      app.querySelectorAll('[data-song]').forEach(btn => btn.addEventListener('click', () => goToSong(+btn.dataset.song)));
      const letraTa = app.querySelector('#letra-audiencia-edit');
      if(letraTa){
        const btnGuardar = app.querySelector('#btn-letra-guardar');
        if(btnGuardar) btnGuardar.addEventListener('click', () => {
          const curSec = currentSecciones()[proy.sectionIndex];
          if(!curSec) return;
          setLetraOverride(culto, song, curSec, letraTa.value);
          channel.postMessage(proy);
          showToast('Letra guardada para la audiencia');
          paint();
        });
        const btnRestaurar = app.querySelector('#btn-letra-restaurar');
        if(btnRestaurar) btnRestaurar.addEventListener('click', () => {
          const curSec = currentSecciones()[proy.sectionIndex];
          if(!curSec) return;
          clearLetraOverride(culto, song, curSec);
          channel.postMessage(proy);
          showToast('Restaurado el original');
          paint();
        });
      }
    }
    proySaveState(culto.id, proy);
    paint();
  }

  let proyKioskChannel = null;
  let proyKioskChannelKey = null;
  function proyManualScaleKey(cultoId, mode){ return 'cifraviva-scale-' + cultoId + '-' + mode; }
  function loadProyManualScale(cultoId, mode){
    try{
      const raw = localStorage.getItem(proyManualScaleKey(cultoId, mode));
      if(raw) return Math.min(2.5, Math.max(0.5, parseFloat(raw)));
    }catch(e){}
    return 1;
  }
  function saveProyManualScale(cultoId, mode, val){
    try{ localStorage.setItem(proyManualScaleKey(cultoId, mode), String(val)); }catch(e){}
  }

  function renderProyeccionKiosk(cultoId, mode){
    app.classList.add('proy-kiosk', 'proy-' + mode);
    app.classList.remove(mode === 'audiencia' ? 'proy-musicos' : 'proy-audiencia');

    function adjustScale(delta){
      const cur = loadProyManualScale(cultoId, mode);
      const next = Math.min(2.5, Math.max(0.5, +(cur + delta).toFixed(2)));
      saveProyManualScale(cultoId, mode, next);
      paint();
    }

    function paint(){
      const culto = cultos.find(c => c.id === cultoId);
      const list = culto ? culto.songIds.map(id => songs.find(s => s.id === id)).filter(Boolean) : [];
      const proy = proyLoadState(cultoId);
      const manualScale = loadProyManualScale(cultoId, mode);
      const content = computeKioskContent(culto, list, proy, mode);
      PROY_FONDOS.forEach(f => app.classList.remove('proy-bg-' + f.id));
      app.classList.add('proy-bg-' + (content.fondo || 'negro'));
      if(content.empty){
        app.innerHTML = `<div class="proy-kiosk-inner"><p class="proy-empty">Repertorio sin canciones.</p></div>`;
        return;
      }
      if(content.blackout){
        app.innerHTML = `<div class="proy-blackout" style="position:fixed; inset:0;"></div>`;
        return;
      }
      app.innerHTML = `
        ${mode === 'musicos' ? `
          <div class="proy-meta-badge">
            <span>Tono <b>${escapeHtml(content.tonoDisplay)}</b></span>
            ${content.compas ? `<span>Compás <b>${escapeHtml(content.compas)}</b></span>` : ''}
            ${content.tempo ? `<span><b>${escapeHtml(content.tempo)}</b> BPM</span>` : ''}
          </div>
        ` : ''}
        <div class="proy-kiosk-inner">
          <div class="proy-song-title">${escapeHtml(content.song.titulo)}</div>
          <pre class="proy-body" style="--proy-scale:${content.fontScale * manualScale};">${content.bodyHtml || '<span class="proy-empty">— sin contenido —</span>'}</pre>
        </div>
        <div class="proy-size-ctrl">
          <button type="button" id="btn-proy-size-down" aria-label="Letra más chica">A−</button>
          <button type="button" id="btn-proy-size-up" aria-label="Letra más grande">A+</button>
        </div>
      `;
      app.querySelector('#btn-proy-size-down').addEventListener('click', () => adjustScale(-0.1));
      app.querySelector('#btn-proy-size-up').addEventListener('click', () => adjustScale(0.1));
    }
    paint();

    const key = cultoId + ':' + mode;
    if(proyKioskChannelKey !== key){
      if(proyKioskChannel) proyKioskChannel.close();
      proyKioskChannelKey = key;
      proyKioskChannel = new BroadcastChannel(proyChannelName(cultoId));
    }
    proyKioskChannel.onmessage = paint;
    window.onstorage = (ev) => {
      if(ev.key === proyStorageKey(cultoId)) paint();
    };
  }

  function renderCultoForm(){
    const editing = state.currentId ? cultos.find(c => c.id === state.currentId) : null;
    let formSongIds = editing ? [...editing.songIds] : [];
    let formTransposes = editing ? {...(editing.transposes || {})} : {};
    let pickerQuery = '';

    function songRowHtml(id, idx){
      const s = songs.find(x => x.id === id);
      if(!s) return '';
      const semis = formTransposes[id] || 0;
      const tonoCulto = transposeChordToken(s.tono || '-', semis);
      return `
        <div class="sec-edit-row">
          <div class="sec-edit-top" style="margin-bottom:0;">
            <div style="flex:1;min-width:0;">
              <p class="song-card-title" style="font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${idx+1}. ${escapeHtml(s.titulo)}</p>
            </div>
            <div class="sec-edit-move">
              <button type="button" class="icon-btn culto-move-up" data-idx="${idx}" aria-label="Subir" ${idx===0?'disabled':''}>↑</button>
              <button type="button" class="icon-btn culto-move-down" data-idx="${idx}" aria-label="Bajar" ${idx===formSongIds.length-1?'disabled':''}>↓</button>
              <button type="button" class="icon-btn culto-remove-song" data-idx="${idx}" aria-label="Quitar">${ICONS.trash}</button>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);">
            <span>Tono para este repertorio:</span>
            <button type="button" class="icon-btn culto-tono-down" data-id="${id}" aria-label="Bajar tono" style="width:30px;height:30px;">−</button>
            <b style="color:var(--ink); min-width:26px; text-align:center; font-family:var(--font-mono);">${escapeHtml(tonoCulto)}</b>
            <button type="button" class="icon-btn culto-tono-up" data-id="${id}" aria-label="Subir tono" style="width:30px;height:30px;">+</button>
            ${semis !== 0 ? `<span style="font-size:12px;">(original: ${escapeHtml(s.tono||'-')})</span>` : ''}
          </div>
        </div>
      `;
    }

    function renderSongList(){
      const list = app.querySelector('#culto-songs-list');
      list.innerHTML = formSongIds.length
        ? formSongIds.map(songRowHtml).join('')
        : '<p style="color:var(--ink-soft);font-size:14px;margin:0;">Aún no agregas canciones.</p>';
      list.querySelectorAll('.culto-move-up').forEach(btn => btn.addEventListener('click', () => {
        const i = +btn.dataset.idx;
        if(i > 0){ [formSongIds[i-1], formSongIds[i]] = [formSongIds[i], formSongIds[i-1]]; renderSongList(); }
      }));
      list.querySelectorAll('.culto-move-down').forEach(btn => btn.addEventListener('click', () => {
        const i = +btn.dataset.idx;
        if(i < formSongIds.length - 1){ [formSongIds[i+1], formSongIds[i]] = [formSongIds[i], formSongIds[i+1]]; renderSongList(); }
      }));
      list.querySelectorAll('.culto-remove-song').forEach(btn => btn.addEventListener('click', () => {
        formSongIds.splice(+btn.dataset.idx, 1);
        renderSongList();
      }));
      list.querySelectorAll('.culto-tono-down').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        formTransposes[id] = (formTransposes[id] || 0) - 1;
        renderSongList();
      }));
      list.querySelectorAll('.culto-tono-up').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        formTransposes[id] = (formTransposes[id] || 0) + 1;
        renderSongList();
      }));
    }

    function renderPickerList(){
      const wrap = app.querySelector('#picker-list');
      const q = pickerQuery.trim().toLowerCase();
      const filtered = songs.filter(s => !q || s.titulo.toLowerCase().includes(q));
      wrap.innerHTML = filtered.length ? filtered.map(s => `
        <button type="button" class="song-card picker-song-btn" data-id="${s.id}" style="margin-bottom:8px;">
          <div class="song-card-info">
            <p class="song-card-title">${escapeHtml(s.titulo)}</p>
            <p class="song-card-artist">${escapeHtml(s.artista || 'Sin artista')}</p>
          </div>
          <span class="tono-badge" style="${formSongIds.includes(s.id) ? 'background:var(--success);color:#fff;' : ''}">${formSongIds.includes(s.id) ? '✓' : '+'}</span>
        </button>
      `).join('') : '<p style="color:var(--ink-soft);font-size:14px;padding:8px 0;">Sin resultados.</p>';
      wrap.querySelectorAll('.picker-song-btn').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const i = formSongIds.indexOf(id);
        if(i >= 0) formSongIds.splice(i, 1); else formSongIds.push(id);
        renderPickerList();
        renderSongList();
      }));
    }

    app.innerHTML = `
      <div class="detail-header">
        <button class="icon-btn" id="btn-back" aria-label="Volver">${ICONS.back}</button>
        <div class="detail-titles"><h1>${editing ? 'Editar repertorio' : 'Nuevo repertorio'}</h1></div>
      </div>
      <div class="form-view">
        <div class="field-row">
          <div class="field">
            <label for="f-fecha">Fecha</label>
            <input id="f-fecha" type="date" value="${editing ? editing.fecha : ''}" />
          </div>
          <div class="field">
            <label for="f-hora">Hora de inicio</label>
            <input id="f-hora" type="time" value="${editing ? (editing.hora||'') : ''}" />
          </div>
        </div>
        <div class="field">
          <label for="f-nombre-culto">Nombre (opcional)</label>
          <input id="f-nombre-culto" type="text" value="${escapeHtml(editing ? (editing.nombre||'') : '')}" placeholder="Ej: Culto General, Vigilia..." />
        </div>
        <div class="field">
          <label>Canciones del repertorio</label>
          <div id="culto-songs-list"></div>
          <button type="button" class="btn" id="btn-open-picker" style="width:100%">+ Agregar canción</button>
        </div>
        <div class="form-actions">
          ${editing ? '<button class="btn btn-danger" id="btn-delete-culto" aria-label="Eliminar">' + ICONS.trash + '</button>' : ''}
          <button class="btn btn-primary" id="btn-save-culto">Guardar</button>
        </div>
      </div>
      <div class="modal-overlay" id="picker-modal" hidden>
        <div class="modal-card" style="max-height:75vh;">
          <h2>Agregar canciones</h2>
          <div class="search-wrap"><input type="text" id="picker-search" placeholder="Buscar por título..." /></div>
          <div id="picker-list" style="overflow-y:auto;"></div>
          <button class="btn btn-primary" id="btn-picker-done">Listo</button>
        </div>
      </div>
    `;
    renderSongList();
    app.querySelector('#btn-back').addEventListener('click', () => editing ? go('culto-detail', editing.id) : go('cultos'));
    app.querySelector('#btn-open-picker').addEventListener('click', () => {
      pickerQuery = '';
      app.querySelector('#picker-search').value = '';
      renderPickerList();
      app.querySelector('#picker-modal').hidden = false;
    });
    app.querySelector('#picker-search').addEventListener('input', e => { pickerQuery = e.target.value; renderPickerList(); });
    app.querySelector('#btn-picker-done').addEventListener('click', () => { app.querySelector('#picker-modal').hidden = true; });
    app.querySelector('#picker-modal').addEventListener('click', (e) => { if(e.target.id === 'picker-modal') e.target.hidden = true; });
    if(editing){
      app.querySelector('#btn-delete-culto').addEventListener('click', () => {
        customConfirm('¿Eliminar este repertorio? Esta acción no se puede deshacer.', () => {
          cultos = cultos.filter(c => c.id !== editing.id);
          saveCultos();
          go('cultos');
        });
      });
    }
    app.querySelector('#btn-save-culto').addEventListener('click', () => {
      const fecha = app.querySelector('#f-fecha').value;
      const hora = app.querySelector('#f-hora').value;
      const nombre = app.querySelector('#f-nombre-culto').value.trim();
      if(!fecha){ showToast('Falta la fecha del culto'); return; }
      if(editing){
        editing.fecha = fecha; editing.hora = hora; editing.nombre = nombre; editing.songIds = formSongIds; editing.transposes = formTransposes;
        editing.updatedAt = Date.now();
        saveCultos();
        go('culto-detail', editing.id);
      } else {
        const culto = { id: uid(), fecha, hora, nombre, songIds: formSongIds, transposes: formTransposes, updatedAt: Date.now() };
        cultos.push(culto);
        saveCultos();
        go('culto-detail', culto.id);
      }
    });
  }

  window.addEventListener('afterprint', () => {
    delete app.dataset.printMode;
    document.title = ORIGINAL_TITLE;
  });

  function fetchRoleAndRender(user){
    currentUser = user;
    db.collection('usuarios').doc(user.uid).get().then(snap => {
      if(snap.exists){
        const r = snap.data().rol;
        userRole = (r === 'lider' || r === 'musico') ? r : 'pendiente';
      } else {
        userRole = 'pendiente';
        db.collection('usuarios').doc(user.uid).set({ email: user.email, rol: 'pendiente', creadoAt: Date.now() }).catch(()=>{});
        notifyNewMemberPending(user.email);
      }
      render();
      if(userRole !== 'pendiente') initCloudSync();
    }).catch(e => {
      console.warn('No se pudo leer el rol de usuario', e);
      userRole = 'pendiente';
      render();
    });
  }

  render();
  if(window.firebase && db){
    firebase.auth().onAuthStateChanged(user => {
      if(user){ fetchRoleAndRender(user); }
      else { currentUser = null; userRole = 'musico'; render(); }
    });
  } else {
    currentUser = null;
    render();
  }
})();
</script>
